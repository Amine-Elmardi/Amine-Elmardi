name: Normalize MM ticket identifiers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-mm.yml', 'scripts/normalize_mm.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Normalize existing ticket files
        run: python3 scripts/normalize_mm.py
      - name: Commit updated ticket pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tickets
          git diff --cached --quiet && exit 0
          git commit -m 'Use independent MM support IDs and remove PDF reference sections'
          git push origin HEAD:main
